<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BMO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23ffceb3'/><circle cx='20' cy='24' r='5' fill='%23101116'/><circle cx='44' cy='24' r='5' fill='%23101116'/><path d='M20 42 Q32 52 44 42' stroke='%238e233d' stroke-width='4' fill='none' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
  <main class="bmo-shell" id="bmo-shell">
    <section class="bmo-face-frame" id="bmo-face-frame" aria-label="BMO Face">
      <canvas
        id="bmo-face-canvas"
        width="600"
        height="600"
        data-viseme="Neutral"
        data-eyes="open"
      ></canvas>
    </section>

    <section class="bmo-hud" aria-live="polite">
      <div class="bmo-status-row">
        <span class="bmo-status-dot" id="bmo-status-dot" data-state="loading"></span>
        <span class="bmo-status-text" id="bmo-status">Starting Qwen 0.5B &amp; BMO Voice…</span>
      </div>

      <div class="bmo-progress-wrap" id="bmo-progress-wrap">
        <div class="bmo-progress-bar" id="bmo-progress-bar" style="width: 4%"></div>
      </div>

      <p class="bmo-caption" id="bmo-caption">Say hello to BMO or hold Space to talk</p>
    </section>

    <section class="bmo-controls">
      <button
        type="button"
        class="bmo-mic-btn"
        id="btn-mic"
        title="Tap to toggle mic or hold Space to talk"
        aria-label="Talk to BMO"
      >
        <span class="mic-ring" id="mic-ring"></span>
        <svg class="mic-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
        <span id="btn-mic-label">Listening</span>
      </button>

      <button
        type="button"
        class="bmo-kbd-toggle"
        id="btn-keyboard"
        title="Type instead of talk"
        aria-label="Toggle keyboard text box"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="6" y1="9" x2="6.01" y2="9"></line>
          <line x1="10" y1="9" x2="10.01" y2="9"></line>
          <line x1="14" y1="9" x2="14.01" y2="9"></line>
          <line x1="18" y1="9" x2="18.01" y2="9"></line>
          <line x1="6" y1="13" x2="6.01" y2="13"></line>
          <line x1="18" y1="13" x2="18.01" y2="13"></line>
          <line x1="8" y1="15" x2="16" y2="15"></line>
        </svg>
      </button>
    </section>

    <form class="bmo-keyboard-box" id="keyboard-box" hidden>
      <input
        type="text"
        id="prompt-input"
        class="bmo-prompt-input"
        placeholder="Type something to BMO…"
        autocomplete="off"
      />
      <button type="submit" class="bmo-send-btn" id="btn-send">Send</button>
    </form>
  </main>

  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
