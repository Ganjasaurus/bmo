<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BMO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2368cbb5'/><circle cx='20' cy='26' r='5.5' fill='%23185a37'/><circle cx='44' cy='26' r='5.5' fill='%23185a37'/><path d='M22 44 Q32 52 42 44' stroke='%238e233d' stroke-width='4' fill='none' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="./style.css?v=10" />
</head>
<body>
  <main class="bmo-shell" id="bmo-shell">
    <section class="bmo-face-frame" id="bmo-face-frame" aria-label="BMO Anime Face">
      <canvas
        id="bmo-face-canvas"
        width="600"
        height="600"
        data-viseme="Neutral"
        data-eyes="open"
      ></canvas>
      <button
        type="button"
        class="bmo-viseme-badge"
        id="bmo-viseme-badge"
        title="Click to audition all 12 anime viseme mouths"
        aria-expanded="false"
      >Neutral</button>
      <div class="bmo-viseme-strip" id="bmo-viseme-strip" hidden aria-label="12-Viseme Mouth Audition"></div>
    </section>

    <section class="bmo-hud" aria-live="polite">
      <div class="bmo-status-row">
        <span class="bmo-status-dot" id="bmo-status-dot" data-state="loading"></span>
        <span class="bmo-status-text" id="bmo-status">Starting Qwen 0.5B &amp; BMO Voice…</span>
      </div>

      <div class="bmo-progress-wrap" id="bmo-progress-wrap">
        <div class="bmo-progress-bar" id="bmo-progress-bar" style="width: 6%"></div>
      </div>

      <p class="bmo-caption" id="bmo-caption">Hi friend! I am BMO! Say hello or tap the keyboard to chat.</p>

      <div class="bmo-history-strip" id="bmo-history-strip" hidden></div>
    </section>

    <section class="bmo-controls">
      <button
        type="button"
        class="bmo-mic-btn"
        id="btn-mic"
        title="Tap to toggle mic or hold Space to talk"
        aria-label="Talk to BMO"
      >
        <span class="mic-ring" id="mic-ring"></span>
        <svg class="mic-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
        <span id="btn-mic-label">Listening</span>
      </button>

      <button
        type="button"
        class="bmo-icon-toggle"
        id="btn-keyboard"
        title="Type instead of talk"
        aria-label="Toggle keyboard text box"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="6" y1="9" x2="6.01" y2="9"></line>
          <line x1="10" y1="9" x2="10.01" y2="9"></line>
          <line x1="14" y1="9" x2="14.01" y2="9"></line>
          <line x1="18" y1="9" x2="18.01" y2="9"></line>
          <line x1="6" y1="13" x2="6.01" y2="13"></line>
          <line x1="18" y1="13" x2="18.01" y2="13"></line>
          <line x1="8" y1="15" x2="16" y2="15"></line>
        </svg>
      </button>

      <button
        type="button"
        class="bmo-icon-toggle"
        id="btn-image"
        title="Local Image Studio — generate art with BMO"
        aria-label="Toggle local image generator"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
      </button>
    </section>

    <form class="bmo-keyboard-box" id="keyboard-box" hidden>
      <input
        type="text"
        id="prompt-input"
        class="bmo-prompt-input"
        placeholder="Type to BMO (or 'draw a sunset forest')…"
        autocomplete="off"
      />
      <button type="submit" class="bmo-send-btn" id="btn-send">Send</button>
    </form>

    <section class="bmo-image-studio" id="image-studio" hidden aria-label="BMO Local Image Studio">
      <div class="bmo-studio-header">
        <span class="bmo-studio-title">BMO Local Image Studio</span>
        <span class="bmo-studio-step" id="img-step-status">Ready</span>
        <button type="button" class="bmo-studio-close" id="btn-img-close" aria-label="Close Image Studio">✕</button>
      </div>

      <div class="bmo-studio-body">
        <div class="bmo-studio-canvas-wrap">
          <canvas id="bmo-image-canvas" width="512" height="512"></canvas>
        </div>

        <div class="bmo-studio-presets" id="image-preset-chips" aria-label="Quick Art Prompts"></div>

        <form class="bmo-studio-controls" id="image-form">
          <input
            type="text"
            id="image-prompt-input"
            class="bmo-prompt-input"
            placeholder="Describe what BMO should paint…"
            value="BMO in a glowing emerald forest at sunset"
            autocomplete="off"
          />
          <div class="bmo-studio-row">
            <select id="image-style-select" class="bmo-style-select" aria-label="Art Style">
              <option value="anime">Anime Studio</option>
              <option value="ghibli">Dreamy Meadow</option>
              <option value="cyberpunk">Neon Cyber</option>
              <option value="pixel">16-Bit Pixel</option>
              <option value="watercolor">Storybook Ink</option>
            </select>
            <button type="submit" class="bmo-send-btn" id="btn-img-generate">Paint</button>
            <button type="button" class="bmo-secondary-btn" id="btn-img-download" title="Download PNG">Save</button>
          </div>
        </form>

        <div class="bmo-studio-gallery" id="image-gallery-strip" hidden aria-label="Recent Paintings"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js?v=10"></script>
</body>
</html>
